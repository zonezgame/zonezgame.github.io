<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1019"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ZONE Z">
<meta name="description" content="ZONE Z – bắt zombie bằng camera, chụp flash cứu người, đổi topping tại THEZONE.">
<script src="firebase-config.js"></script>
<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head><body>
<title>Zombie TheZone</title>
<link rel="preload" as="image" href="img/home.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: một màn hình điện thoại. Vùng An Toàn = 3 tab dưới; đi săn = khung ngắm toàn màn hình trên phố đêm, đèn đường natri làm màu nhấn */
:root{
  --night:#0b1019; --panel:#131a27; --panel-2:#1a2333; --line:#273247;
  --fg:#eef1f6; --muted:#8e98ab; --sodium:#ffb547; --sodium-ink:#1f1404; --flash:#f6faff; --rot:#93ad8c; --danger:#ff6767; --ok:#7fd1a0;
  --r1:#aab3c2; --r2:#62a9ff; --r3:#b993ff; --r4:#ff6f5c; --r5:#ffd36b;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --hud:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,label:focus-within{outline:2px solid var(--sodium);outline-offset:2px}
h2,h3{margin:0;text-wrap:balance}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:18px}
.screen>*{flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:12px 2px 13px;font-family:var(--hud);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.tabs button[aria-selected="true"]{color:var(--sodium);box-shadow:inset 0 2px 0 var(--sodium)}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wm{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.02em;color:var(--fg)}
.wm span{color:var(--sodium)}
.by{display:block;margin-top:6px;font-family:var(--hud);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.chip{font-family:var(--hud);font-size:12px;letter-spacing:.06em;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.lede{margin:0;color:var(--muted);max-width:60ch}
.lede b{color:var(--fg);font-weight:500}

.season{position:relative;overflow:hidden;border-radius:14px;padding:16px;background:linear-gradient(135deg,#2a1838 0%,#151c29 70%);border:1px solid #3b2a4a}
.season .eyebrow{font-family:var(--hud);font-size:12px;letter-spacing:.14em;color:#ffb27a;text-transform:uppercase}
.season h3{font-family:var(--display);font-size:22px;font-weight:400;margin-top:4px}
.season p{margin:6px 0 0;color:#c9c2d6;font-size:14px}
.season .moon{position:absolute;right:-18px;top:-18px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffcf8a,#ff8a3d 60%,transparent 62%);opacity:.35}

.wallet{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat label{display:block;font-family:var(--hud);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat b{display:block;font-family:var(--hud);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pips{display:flex;gap:3px;margin:9px 0 6px}
.pips i{flex:1;height:14px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--flash);box-shadow:0 0 6px rgba(246,250,255,.5)}

.cta{display:block;width:100%;padding:18px;border-radius:14px;background:var(--sodium);color:var(--sodium-ink);font-family:var(--display);font-size:24px;letter-spacing:.03em;box-shadow:0 8px 30px -10px rgba(255,181,71,.6)}
.cta:active{transform:translateY(1px)}
.ghost{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.note{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-family:var(--hud);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 14px;background:var(--panel)}
.row+.row{border-top:1px solid var(--line)}
.row .nm{min-width:0}
.row .nm b{font-weight:500}
.row .meta{font-family:var(--hud);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.tier{display:inline-block;margin-left:6px;font-family:var(--hud);font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:999px;border:1px solid currentColor;vertical-align:1px}
.t1{color:var(--r1)}.t2{color:var(--r2)}.t3{color:var(--r3)}.t4{color:var(--r4)}.t5{color:var(--r5)}
.btn{padding:8px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--hud);font-weight:700;font-size:13px;letter-spacing:.04em}
.btn.pri{background:var(--sodium);color:var(--sodium-ink);border-color:var(--sodium)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.tg{display:flex;flex-direction:column;gap:8px}
.tgh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tchip{font-family:var(--hud);font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--c);color:#14110a}
.tg .list{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.ti{display:flex;align-items:center;gap:10px}.ti img{flex:none;width:44px;height:44px}.row .ti img[width="48"]{width:52px;height:52px}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fr{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.fr .pic{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;padding:6px;background:var(--b,#222)}
.fr .pic::before{content:"";position:absolute;inset:6px;border:2px solid var(--a,#888);border-radius:4px}
.fr .pic::after{content:"";position:absolute;left:28%;right:28%;bottom:6px;height:52%;border-radius:40% 40% 4px 4px;background:var(--a,#888);opacity:.28}
.fr .pic .lb{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--display);font-size:9px;color:var(--a);z-index:1}
.fr.lock .pic{background:var(--panel);}
.fr.lock .pic::before{border-style:dashed;border-color:var(--line)}
.fr.lock .pic::after{display:none}
.fr.lock .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--line)}
.fr .cap{font-size:12px;line-height:1.3;min-width:0}
.fr .cap small{display:block;color:var(--muted);font-family:var(--hud);font-size:11px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles .stat b{font-size:22px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-family:var(--hud);font-size:13px;font-variant-numeric:tabular-nums}
.bar .tr{position:relative;height:12px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--sodium);border-radius:3px}
.bar .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--flash);text-decoration:none}
.bar span:first-child{min-width:44px}
.bar span:last-child{color:var(--muted);text-align:right;min-width:72px}
.tune{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tune label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.tune input[type=number]{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--hud);font-size:16px}
.tune .ck{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--sodium);color:var(--sodium)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-family:var(--hud);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;background:var(--panel);font-weight:700}
.tbl tr+tr td{border-top:1px solid var(--line)}
.motto{font-family:var(--hud);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:center}

/* --- Săn --- */
.hunt{position:fixed;inset:0;z-index:50;background:#05070b;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hunt canvas,.hunt video{position:absolute;inset:0;width:100%;height:100%;display:block}
.hunt video{object-fit:cover;background:#05070b}
.hunt canvas{touch-action:none}
.hunt video:not(.on){display:none}
.vf{position:absolute;inset:16% 9% 30% 9%;pointer-events:none}
.vf i{position:absolute;width:26px;height:26px;border:2px solid rgba(246,250,255,.55)}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-family:var(--hud);font-size:13px;letter-spacing:.08em;background:linear-gradient(#05070bcc,transparent)}
.rec{display:flex;align-items:center;gap:8px}
.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.hud-top .x{padding:7px 12px;border:1px solid rgba(246,250,255,.35);border-radius:999px;font-family:var(--hud);font-size:13px}
.hud-sub{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);display:flex;justify-content:center;gap:14px;font-family:var(--hud);font-size:13px;color:#cfd6e2;font-variant-numeric:tabular-nums}
.hud-bot{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:stretch;background:linear-gradient(transparent,#05070bee 35%)}
.hud-bot>*{max-width:448px;width:100%;margin:0 auto}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .lbl{display:flex;justify-content:space-between;font-family:var(--hud);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.meter .lbl b{color:var(--sodium)}
.meter .tr{height:10px;border-radius:5px;background:rgba(246,250,255,.12);overflow:hidden}
.meter .tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4d6b8a,var(--sodium) 70%,var(--danger));transition:width .25s}
.hint{min-height:22px;text-align:center;color:#d8dee8;font-size:14px}
.hrow{display:flex;gap:10px}
.hrow>*{flex:1}
.hbtn{padding:13px 10px;border-radius:12px;border:1px solid rgba(246,250,255,.3);background:rgba(10,14,22,.6);font-size:14px;text-align:center}
.hbtn input{position:absolute;width:1px;height:1px;opacity:0}
.dist{display:flex;justify-content:space-between;font-family:var(--hud);font-size:13px;letter-spacing:.06em;color:#cfd6e2;font-variant-numeric:tabular-nums}
.dist b{font-size:17px;color:var(--fg)}
.dbar{height:8px;border-radius:4px;background:rgba(246,250,255,.12);overflow:hidden}.dbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd18b,#ffb547 55%,#ff4d4d)}
.who-img{display:flex;justify-content:center;margin:-8px 0 -10px}
.me{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.me img{flex:none;width:58px;height:58px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line)}
.me b{display:block;font-size:17px}.me small{color:var(--muted);font-size:13px}
.me.inf{border-color:var(--danger);background:#2a1416}.me.inf img{border-color:var(--danger)}.me.inf small{color:#ffb0a8}
.infbox{border:2px solid var(--danger);border-radius:14px;padding:14px;background:#1f1012;display:flex;flex-direction:column;gap:8px}
.infbox h3{font-family:var(--display);font-size:18px;font-weight:400;color:#ff8a80}.infbox ul{margin:0;padding-left:18px;color:#f3c9c4;font-size:14px}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.avgrid button{border:2px solid var(--line);border-radius:12px;padding:2px;background:var(--panel-2)}.avgrid button[aria-pressed="true"]{border-color:var(--sodium);box-shadow:0 0 0 2px var(--sodium)}
.avgrid img{display:block;width:100%;height:auto}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;font-size:16px}
#hudAv{width:30px;height:30px;border-radius:50%;background:#1a2333;border:2px solid rgba(246,250,255,.4);margin-top:-6px}
#infChip{color:#ff8a80;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:95;max-width:min(88vw,420px);padding:12px 16px;border-radius:12px;background:#f6faff;color:#0b1019;font-weight:500;box-shadow:0 10px 30px #000a;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet .card h3{margin:0;font-size:20px}
.shoot.lock{border-color:#cde86b;box-shadow:0 0 0 6px rgba(205,232,107,.35),0 0 28px rgba(205,232,107,.7)}
.shoot{touch-action:none;align-self:center;width:96px!important;height:96px;border-radius:50%;border:4px solid var(--flash);background:radial-gradient(circle,var(--flash) 0 52%,transparent 54%);box-shadow:0 0 0 6px rgba(246,250,255,.12);margin:0 auto}
.shoot:active{transform:scale(.94)}
.aimrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--hud);font-size:13px;letter-spacing:.06em}
.hp{display:flex;gap:4px}
.hp i{width:16px;height:6px;border-radius:2px;background:var(--rot)}
.hp i.off{background:rgba(246,250,255,.15)}
.bubble{position:absolute;left:50%;transform:translateX(-50%);top:22%;max-width:min(80%,360px);padding:10px 14px;border-radius:14px;background:rgba(246,250,255,.95);color:#111827;font-size:15px;font-weight:500;text-align:center;pointer-events:none;transition:opacity .25s}
.bubble small{display:block;font-family:var(--hud);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.flashfx{position:absolute;inset:0;background:var(--flash);opacity:0;pointer-events:none}
.flashfx.go{animation:fl .38s ease-out}

/* Sảnh (màn hình chính) */
.screen.lobbyMode{padding:0;gap:0;background:#07090f}
.lobby{display:flex;flex-direction:column;min-height:100%}
.art{position:relative;aspect-ratio:941/1050;background:#07090f url(img/home.webp) top center/cover no-repeat}
.art::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(to bottom,rgba(7,9,15,0),#07090f 92%)}
.art .tr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:10px;z-index:2}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(10,12,20,.62);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(4px)}
.ic svg{width:24px;height:24px}
.deck{position:relative;z-index:1;margin-top:-26%;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:14px}
.me.lob{background:rgba(12,15,24,.82);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.14);padding:8px 10px}
.me.lob img{width:52px;height:52px}
.me.lob>span:nth-child(2){flex:1;min-width:0}.me.lob>span:nth-child(2) b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .res{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--hud);font-weight:700;font-size:15px;color:#fff;white-space:nowrap}
.me .res em{font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-right:6px}
.me .res .tz{color:var(--sodium)}
.infbar{display:flex;flex-direction:column;gap:6px;background:rgba(90,10,18,.78);border:1.5px solid #ff4d4d;border-radius:12px;padding:10px 12px;font-size:13px;color:#ffd9d9}
.infbar b{color:#fff}.row2{display:flex;gap:8px}.row2 .btn{flex:1;padding:10px 6px;font-size:13px}
.startwrap{padding:6px;border-radius:14px;background:repeating-linear-gradient(-45deg,#111 0 12px,#ffd23f 12px 24px);box-shadow:0 10px 30px rgba(255,190,40,.25),0 0 0 2px #000}
.start{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 10px 14px;border-radius:9px;border:2px solid #1a1505;background:linear-gradient(180deg,#ffe066,#ffc928 60%,#e8a90f);color:#111;font-family:var(--display);font-size:44px;line-height:1;letter-spacing:.02em;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.start span{transform:skewX(-8deg);display:inline-block}
.start:active{transform:translateY(2px)}
@media (prefers-reduced-motion:no-preference){.startwrap{animation:pulseS 2.4s ease-in-out infinite}@keyframes pulseS{50%{box-shadow:0 10px 38px rgba(255,190,40,.5),0 0 0 2px #000}}}
.hint{margin:-4px 0 0;text-align:center;font-size:13px;color:#c9cfdb}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t6{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px 12px;border-radius:10px;color:#fff;text-align:center;
 background:linear-gradient(160deg,#1d2331,#0d1018);border:1.5px solid var(--c);box-shadow:0 0 14px -4px var(--c),inset 0 1px 0 rgba(255,255,255,.06);
 clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.t6 b{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.t6 small{font-size:11px;color:var(--c);line-height:1.25}
.t6 .dot{position:absolute;top:7px;right:9px;width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 2px #0d1018}
.lobby .motto{text-align:center;margin:4px 0 0}

let AC=null;
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC};
function tone(f,d,type='sine',v=.07,to){const a=ac();if(!a||S.mute)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function shutter(){const a=ac();if(!a||S.mute)return;const len=Math.floor(a.sampleRate*.09),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='highpass';f.frequency.value=1800;g.gain.value=.35;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start();tone(2400,.05,'square',.03)}
/* ---------- Âm thanh rượt đuổi: gầm gừ zombie + tim đập (tổng hợp bằng WebAudio, không cần tải file) ---------- */
const SFX={bus:null};
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function sfxInit(){const a=ac();if(!a)return null;if(SFX.bus&&SFX.ctx===a)return a;SFX.ctx=a;
 const bus=a.createDynamicsCompressor();bus.threshold.value=-16;bus.knee.value=12;bus.ratio.value=5;bus.attack.value=.004;bus.release.value=.2;bus.connect(a.destination);SFX.bus=bus;
 const len=Math.floor(a.sampleRate*1.8),ir=a.createBuffer(2,len,a.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
 SFX.rev=a.createConvolver();SFX.rev.buffer=ir;const rg=a.createGain();rg.gain.value=.55;SFX.rev.connect(rg).connect(bus);
 const nl=a.sampleRate*2,nb=a.createBuffer(1,nl,a.sampleRate),nd=nb.getChannelData(0);let b=0;for(let i=0;i<nl;i++){b=.97*b+.03*(Math.random()*2-1);nd[i]=b*6+(Math.random()*2-1)*.35}SFX.noise=nb;
 SFX.fry=distCurve(24);SFX.chest=distCurve(5);return a}
function panNode(a,p){if(a.createStereoPanner){const n=a.createStereoPanner();n.pan.value=clamp(p||0,-1,1);return n}return a.createGain()}
/* Gầm gừ kiểu điện ảnh: nhiều lớp chồng nhau
   1) giọng chính: 3 dây thanh lệch tông + rè khàn (vocal fry) + méo nặng, nguyên âm trượt "ư→a→ô"
   2) lớp trầm rung ngực 40–60 Hz   3) tiếng ọc ọc trong cổ họng   4) hơi thở rít trước khi gầm
   5) tiếng vọng lớn khi ở xa. kind: 'growl' gầm thường, 'roar' gào khi vồ/cắn */
function sh(a,t,dur,rate,lo,hi){/* LFO ngẫu nhiên kiểu sample-and-hold, trả về AudioParam-friendly ConstantSource */
 const c=a.createConstantSource?a.createConstantSource():null;if(!c)return null;c.offset.setValueAtTime(lo,t);let x=t;while(x<t+dur){x+=1/rate*(.5+Math.random());c.offset.linearRampToValueAtTime(lo+(hi-lo)*Math.random(),x)}c.start(t);c.stop(t+dur+.1);return c}
function growl(d,pan,kind){const a=sfxInit();if(!a||S.mute)return;const near=clamp(1-d,0,1),roar=kind==='roar',t0=a.currentTime+.01;
 const inhale=!roar&&Math.random()<.55,t=t0+(inhale?rnd(.25,.4):0),dur=(roar?rnd(1,1.5):rnd(1.4,2.6))*(1-.2*near);
 const out=a.createGain(),pk=(roar?.62:.42)*(.1+.9*near*near);
 out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(pk,t+(roar?.04:.2));out.gain.setValueAtTime(pk*.95,t+dur*.55);out.gain.exponentialRampToValueAtTime(.0004,t+dur);
 const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380+8500*near*near;lp.Q.value=.5;
 const pn=panNode(a,pan*.85);out.connect(lp).connect(pn).connect(SFX.bus);
 const send=a.createGain();send.gain.value=.2+.9*(1-near);lp.connect(send).connect(SFX.rev);
 const stop=[];
 /* 1) giọng chính */
 const f0=(roar?rnd(95,135):rnd(55,82))*(1+.1*Math.random()),voice=a.createGain();voice.gain.value=.5;
 const fry=a.createGain();fry.gain.value=.5;const am=sh(a,t,dur,roar?40:26,.05,1);if(am)am.connect(fry.gain);
 for(const det of [1,.993,1.012]){const o=a.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(f0*det*.75,t);o.frequency.linearRampToValueAtTime(f0*det*(roar?1.6:1.2),t+dur*(roar?.18:.3));o.frequency.linearRampToValueAtTime(f0*det*(roar?1.1:.95),t+dur*.7);o.frequency.linearRampToValueAtTime(f0*det*.55,t+dur);
  const jt=sh(a,t,dur,14,-f0*.07,f0*.07);if(jt)jt.connect(o.frequency);o.connect(voice);o.start(t);stop.push(o)}
 voice.connect(fry);const ws=a.createWaveShaper();ws.curve=distCurve(roar?60:38);ws.oversample='4x';fry.connect(ws);
 const vw=roar?[[700,980,5,1],[1250,1500,7,.75],[2800,3100,9,.4]]:[[330,620,6,1],[780,1050,8,.6],[2400,2600,10,.25]];
 for(const [fa,fb,q,g] of vw){const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=q;bp.frequency.setValueAtTime(fa,t);bp.frequency.linearRampToValueAtTime(fb,t+dur*.35);bp.frequency.linearRampToValueAtTime(fa*.85,t+dur);const gg=a.createGain();gg.gain.value=g*2.6;ws.connect(bp).connect(gg).connect(out)}
 /* 2) lớp trầm rung ngực */
 const sub=a.createOscillator();sub.type='triangle';sub.frequency.setValueAtTime(roar?62:46,t);sub.frequency.linearRampToValueAtTime(roar?48:38,t+dur);
 const sw=a.createWaveShaper();sw.curve=SFX.chest;const sg=a.createGain();sg.gain.value=roar?.9:.75;const slp=a.createBiquadFilter();slp.type='lowpass';slp.frequency.value=180;
 sub.connect(sw).connect(slp).connect(sg).connect(out);const sam=sh(a,t,dur,18,.3,1);if(sam){const sv=a.createGain();sv.gain.value=0;sam.connect(sv.gain);}sub.start(t);stop.push(sub);
 /* 3) ọc ọc cổ họng */
 const gz=a.createBufferSource();gz.buffer=SFX.noise;const gb=a.createBiquadFilter();gb.type='bandpass';gb.Q.value=9;const gfq=sh(a,t,dur,9,250,900);gb.frequency.value=0;if(gfq)gfq.connect(gb.frequency);else gb.frequency.value=500;
 const gg2=a.createGain();gg2.gain.value=0;const gam=sh(a,t,dur,16,0,roar?.5:.9);if(gam)gam.connect(gg2.gain);else gg2.gain.value=.4;gz.connect(gb).connect(gg2).connect(out);gz.start(t,Math.random());stop.push(gz);
 /* 4) hơi rít / gào xé */
 const hz=a.createBufferSource();hz.buffer=SFX.noise;const hf=a.createBiquadFilter();hf.type='bandpass';hf.frequency.value=roar?2600:1500;hf.Q.value=.8;const hg=a.createGain();hg.gain.value=roar?.7:.25;hz.connect(hf).connect(hg).connect(out);hz.start(t,Math.random());stop.push(hz);
 if(inhale){const iz=a.createBufferSource();iz.buffer=SFX.noise;const ifl=a.createBiquadFilter();ifl.type='bandpass';ifl.frequency.setValueAtTime(900,t0);ifl.frequency.linearRampToValueAtTime(2200,t);ifl.Q.value=1.2;
  const ig=a.createGain(),ipk=.22*(.15+.85*near*near);ig.gain.setValueAtTime(0,t0);ig.gain.linearRampToValueAtTime(ipk,t-.06);ig.gain.linearRampToValueAtTime(0,t);
  const ip=panNode(a,pan*.85);iz.connect(ifl).connect(ig).connect(ip).connect(SFX.bus);iz.start(t0,Math.random());iz.stop(t+.02)}
 for(const n of stop)n.stop(t+dur+.05)}
/* Nền u ám khi đang dò: tiếng gió trầm + rền, to dần khi zombie lại gần */
function droneSet(level){if(!SFX.drone){if(level<=0||S.mute)return;sfxInit()}const a=SFX.ctx;if(!a||!SFX.bus)return;if(!SFX.drone){
  const g=a.createGain();g.gain.value=0;const nz=a.createBufferSource();nz.buffer=SFX.noise;nz.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=260;f.Q.value=3;
  const lfo=a.createOscillator();lfo.frequency.value=.09;const lg=a.createGain();lg.gain.value=120;lfo.connect(lg).connect(f.frequency);
  const o=a.createOscillator();o.type='sawtooth';o.frequency.value=41.2;const o2=a.createOscillator();o2.type='sawtooth';o2.frequency.value=41.8;const ol=a.createBiquadFilter();ol.type='lowpass';ol.frequency.value=110;const og=a.createGain();og.gain.value=.35;
  nz.connect(f).connect(g);o.connect(ol);o2.connect(ol);ol.connect(og).connect(g);g.connect(SFX.bus);for(const n of [nz,lfo,o,o2])n.start();SFX.drone={g,f}}
 SFX.drone.g.gain.setTargetAtTime(S.mute?0:level,a.currentTime,.4)}
function beat1(a,t,v,p){const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(70*p,t);o.frequency.exponentialRampToValueAtTime(34*p,t+.14);
 const ws=a.createWaveShaper();ws.curve=SFX.chest;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;
 const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+.26);
 o.connect(ws).connect(lp).connect(g).connect(SFX.bus);o.start(t);o.stop(t+.3);
 const nz=a.createBufferSource();nz.buffer=SFX.noise;const nf=a.createBiquadFilter();nf.type='lowpass';nf.frequency.value=500;const ng=a.createGain();ng.gain.setValueAtTime(v*.35,t);ng.gain.exponentialRampToValueAtTime(.0008,t+.05);nz.connect(nf).connect(ng).connect(SFX.bus);nz.start(t,Math.random());nz.stop(t+.06)}
/* Một nhịp tim "thình-thịch"; v: 0..1 độ lớn, fast: 0..1 càng gấp thì hai tiếng càng sát */
function heartbeat(v,fast){const a=sfxInit();if(!a||S.mute)return;const t=a.currentTime+.01,amp=.25+.75*v;beat1(a,t,amp,1);beat1(a,t+.2-.07*fast,amp*.7,1.18)}

function simulate(n=1000){const c=S.cfg;const d=[0,0,0],tiers=[0,0,0,0,0,0];let w=0,tz=0,fr=0,since=0;
 for(let i=0;i<n;i++){const t=Math.min(sampleWait(c),c.cap);w+=t;d[t<=5?0:t<=25?1:2]++;const k=rollTier(t);tiers[k]++;const T=TIERS[k];tz+=(T.tz[0]+T.tz[1])/2*1.1;
  if(k===5||since>=29||Math.random()<T.frame){fr++;since=0}else since++}
 return{dist:d.map(v=>v/n*100),avgWait:w/n,avgTz:tz/n,frames:fr/n*100,tiers:tiers.map(v=>v/n*100)}}

async function redeem(id){const t=TOPPINGS.find(x=>x.id===id);if(!t)return;
 const k=dayKey();S.tierLog=S.tierLog||{};const tl=S.tierLog[k]=S.tierLog[k]||{};
 if((S.topLog[k]||0)>=S.cfg.topDay||S.tz<t.price||usedToday(t.k)>=QUOTA[t.k])return;
 if(!(await takeQuota(t.k))){toast('Nhóm này hôm nay đã hết suất.');return}
 S.tz-=t.price;S.topLog[k]=(S.topLog[k]||0)+1;tl[t.k]=(tl[t.k]||0)+1;const c={code:newCode(),item:'Topping '+t.name,kind:'topping',slug:t.id,exp:Date.now()+7*864e5};S.codes.push(c);saveCode(c,t);save();render();codeSheet(c)}
function frameSheet(id){const f=[...Object.values(SEASONS).flatMap(s=>s.frames),CEO_FRAME].find(x=>x.id===id);if(!f)return;
 let c=S.codes.find(x=>x.frame===id);if(!c){c={code:newCode(),item:'Frame '+f.name,kind:'frame',frame:id,exp:Date.now()+7*864e5};S.codes.push(c);saveCode(c,null);save()}codeSheet(c)}
function qr(cv,seed){const n=25,ctx=cv.getContext('2d');cv.width=n*8;cv.height=n*8;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
 let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
 ctx.fillStyle='#0b1019';const fin=(x,y)=>{ctx.fillRect(x*8,y*8,56,56);ctx.fillStyle='#fff';ctx.fillRect(x*8+8,y*8+8,40,40);ctx.fillStyle='#0b1019';ctx.fillRect(x*8+16,y*8+16,24,24)};
 for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++){const inF=(x<9&&y<9)||(x>n-10&&y<9)||(x<9&&y>n-10);if(!inF&&r()<.48)ctx.fillRect(x*8,y*8,8,8)}
 fin(1,1);fin(n-8,1);fin(1,n-8)}

 if(it.st==='double')s+=`<circle r="${R+6}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
 for(const a of ticks){const r=a*Math.PI/180,x1=Math.cos(r)*R*1.15,y1=Math.sin(r)*R*1.15,x2=Math.cos(r)*R*1.55,y2=Math.sin(r)*R*1.55;

 if(navigator.share){navigator.share({title:'ZONE Z',text,url}).catch(()=>{})}else{try{await navigator.clipboard.writeText(text+' '+url);toast('Đã chép link. Dán gửi bạn bè qua Zalo hoặc Messenger.')}catch(e){prompt('Gửi link này cho bạn bè',url)}}}
function listenCure(){if(!CLOUD.user||!S.cureId||CLOUD.cureUnsub)return;
 CLOUD.cureUnsub=CLOUD.db.collection('cures').doc(S.cureId).onSnapshot(s=>{const d=s.data();if(!d||!d.done)return;
  CLOUD.cureUnsub&&CLOUD.cureUnsub();CLOUD.cureUnsub=null;const was=infected();S.infectedUntil=0;S.cureId=null;save();
  if(was){toast(`${d.byName||'Một người bạn'} đã chụp flash chữa cho bạn!`);tone(880,.12);setTimeout(()=>tone(1320,.2),110)}if($('#hunt').hidden)render()},()=>{})}
/* ---------- Trạm nạp flash: QR dán tại cửa hàng đối tác, quét là đầy flash ---------- */
const STATION_LV={nho:{name:'Trạm nhỏ',cap:5},vua:{name:'Trạm vừa',cap:10},lon:{name:'Trạm lớn',cap:25}};
let PENDING_STATION=new URLSearchParams(location.search).get('tram');
if(PENDING_STATION)history.replaceState(null,'',location.pathname+location.search.replace(/[?&]tram=[^&]*/,'').replace(/^&/,'?'));
function stationSheet(title,body,ok){const sh=$('#sheet');sh.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div style="font-size:44px;line-height:1">${ok?'⚡':'🔒'}</div><h3 style="font-family:var(--display);font-weight:400;font-size:22px;margin:0">${esc(title)}</h3><p class="note" style="margin:0">${body}</p><button class="btn pri" id="stOk" type="button" style="width:100%">${ok?'Đi dò zombie':'Đóng'}</button></div>`;sh.hidden=false;
 $('#stOk').addEventListener('click',()=>{sh.hidden=true;if(ok){tab='home';render()}})}
async function chargeAt(id){id=String(id||'').replace(/[^A-Za-z0-9]/g,'').slice(0,20);if(!id)return;
 if(!CLOUD.on||!CLOUD.user){stationSheet('Chưa kết nối','Trạm nạp cần mạng để kiểm tra lượt. Bật mạng rồi quét lại nhé.',false);return}
 const db=CLOUD.db,uid=CLOUD.user.uid,stRef=db.collection('stations').doc(id),useRef=db.collection('stationUse').doc(id+'_'+dayKey());
 /* Kiểm tra vị trí: trạm có toạ độ thì phải đứng gần trạm mới nạp được */
 let geo=null;try{const pre=await stRef.get();const pd=pre.exists?pre.data():null;
  if(pd&&typeof pd.lat==='number'&&typeof pd.lng==='number'){stationSheet('Đang kiểm tra vị trí…','Cho phép game dùng vị trí để xác nhận bạn đang ở <b>'+esc(pd.name||'trạm')+'</b>.',false);$('#stOk').hidden=true;
   let pos;try{pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:12000,maximumAge:30000}):no({code:2}))}
   catch(e){stationSheet('Cần bật vị trí',e&&e.code===1?'Trạm này cần vị trí (GPS) để chống quét từ xa. Vào cài đặt trình duyệt, cho phép <b>zonezgame.github.io</b> dùng vị trí rồi quét lại.':'Chưa lấy được vị trí. Bật GPS, ra chỗ thoáng rồi quét lại.',false);return}
   const R=6371000,t=Math.PI/180,dLa=(pos.coords.latitude-pd.lat)*t,dLo=(pos.coords.longitude-pd.lng)*t,
    h=Math.sin(dLa/2)**2+Math.cos(pd.lat*t)*Math.cos(pos.coords.latitude*t)*Math.sin(dLo/2)**2,dist=2*R*Math.asin(Math.sqrt(h)),acc=pos.coords.accuracy||0,lim=(pd.radius||150)+Math.min(acc,100);
   geo={d:Math.round(dist),acc:Math.round(acc)};
   if(dist>lim){stationSheet('Bạn chưa ở trạm',`Bạn đang cách <b>${esc(pd.name)}</b> khoảng <b>${dist<1000?Math.round(dist)+' m':(dist/1000).toFixed(1)+' km'}</b>. Đến gần trạm (trong ${pd.radius||150} m) rồi quét lại nhé.`,false);return}}}
 catch(e){}
 try{const r=await db.runTransaction(async tx=>{const st=await tx.get(stRef);if(!st.exists)return{err:'Không tìm thấy trạm này.'};const d=st.data();
   if(!d.active)return{err:`${esc(d.name||'Trạm')} đang tạm ngưng.`};
   const u=await tx.get(useRef),cur=u.exists?u.data():{n:0,users:{}};
   if(cur.users&&cur.users[uid])return{err:`Hôm nay bạn đã nạp ở ${esc(d.name)} rồi. Mai quay lại, hoặc tìm trạm khác.`};
   if((cur.n||0)>=d.cap)return{err:`${esc(d.name)} đã hết ${d.cap} lượt hôm nay. Tìm trạm khác hoặc ghé quầy THEZONE.`};
   tx.set(useRef,{n:(cur.n||0)+1,users:Object.assign({},cur.users,{[uid]:geo?{at:Date.now(),d:geo.d,acc:geo.acc}:Date.now()}),station:id,day:dayKey()});
   return{ok:true,name:d.name,left:d.cap-(cur.n||0)-1,lv:d.level}});
  if(!r.ok){stationSheet('Chưa nạp được',r.err,false);return}
  S.flash=FLASH_MAX;S.flashAt=Date.now();S.stationLog=(S.stationLog||[]).concat([{id,at:Date.now()}]).slice(-100);save();render();
  try{tone(660,.1);setTimeout(()=>tone(990,.12),90);setTimeout(()=>tone(1320,.2),180);buzz([40,40,80])}catch(e){}
  stationSheet('Đã nạp đầy flash!',`<b>${esc(r.name)}</b> · ${(STATION_LV[r.lv]||{}).name||'Trạm nạp'}<br>Flash: <b>${FLASH_MAX}/${FLASH_MAX}</b>. Trạm còn <b>${r.left}</b> lượt hôm nay.`,true)}
 catch(e){stationSheet('Chưa nạp được','Mạng chập chờn, thử quét lại nhé.',false)}}
async function handleStationLink(){if(!PENDING_STATION)return;const id=PENDING_STATION;PENDING_STATION=null;await chargeAt(id)}
/* Quét QR trạm bằng camera ngay trong game */
let SCAN={stream:null,on:false,lib:null};
async function scanStation(){const sh=$('#sheet');sh.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="Quét trạm nạp"><h3 style="font-family:var(--display);font-weight:400;font-size:20px;margin:0">Quét QR trạm nạp</h3><video id="scV" playsinline muted style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#000"></video><p class="note" id="scMsg" style="margin:0">Đưa mã QR của trạm vào khung.</p><button class="btn" id="scX" type="button" style="width:100%">Đóng</button></div>`;sh.hidden=false;
 const stop=()=>{SCAN.on=false;if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}};
 $('#scX').addEventListener('click',()=>{stop();sh.hidden=true});
 try{if(!SCAN.lib){await loadScript('lib/jsQR.js');SCAN.lib=window.jsQR}
  SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('#scV');v.srcObject=SCAN.stream;await v.play();SCAN.on=true}
 catch(e){$('#scMsg').textContent='Không mở được camera. Dùng app camera của máy để quét QR cũng được.';return}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const tick=()=>{if(!SCAN.on)return;const v=$('#scV');if(v&&v.videoWidth){const w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
   const r=SCAN.lib(cx.getImageData(0,0,w,h).data,w,h);if(r){let id=null;try{id=new URL(r.data).searchParams.get('tram')}catch(e){}
    if(id){stop();chargeAt(id);return}$('#scMsg').textContent='Mã này không phải trạm nạp ZONE Z.'}}
  requestAnimationFrame(tick)};tick()}
async function handleCureLink(){const id=new URLSearchParams(location.search).get('cure');if(!id||!CLOUD.user)return;history.replaceState(null,'',location.pathname);
 let d;try{const s=await CLOUD.db.collection('cures').doc(id).get();d=s.exists?s.data():null}catch(e){d=null}
 const sh=$('#sheet');const close='<button class="btn" id="cClose" type="button" style="width:100%">Đóng</button>';
 if(!d){sh.innerHTML=`<div class="card"><h3>Link không còn dùng được</h3>${close}</div>`}
 else if(d.uid===CLOUD.user.uid){sh.innerHTML=`<div class="card"><h3>Đây là link của bạn</h3><p class="note" style="margin:0">Gửi link này cho bạn bè để họ chụp flash cứu bạn.</p>${close}</div>`}
 else if(d.done){sh.innerHTML=`<div class="card"><img src="${SPRITES[d.avatar]?face(d.avatar,'h'):''}" alt="" width="140" height="140"><h3>${esc(d.name)} đã được cứu rồi</h3><p class="note" style="margin:0">${esc(d.byName||'Một người bạn')} nhanh tay hơn bạn.</p>${close}</div>`}
 else{sh.innerHTML=`<div class="card"><img id="cImg" src="${SPRITES[d.avatar]?face(d.avatar,'z'):''}" alt="" width="160" height="160"><h3 style="font-family:var(--display);font-weight:400">${esc(d.name)} bị zombie cắn!</h3>
  <p class="note" style="margin:0">Chụp một phát flash để đưa bạn ấy trở lại. Bạn được +30 TZ vì làm việc tốt.</p><button class="cta" id="cDo" type="button" style="font-size:20px">CHỤP FLASH CỨU</button>${close}</div>`}
 sh.hidden=false;$('#cClose').addEventListener('click',()=>{sh.hidden=true});
 const b=$('#cDo');if(b)b.addEventListener('click',async()=>{b.disabled=true;ac();shutter();buzz(40);
  try{await CLOUD.db.collection('cures').doc(id).update({done:true,by:CLOUD.user.uid,byName:(S.profile&&S.profile.name)||'Một người bạn',doneAt:Date.now()});
   $('#cImg').src=SPRITES[d.avatar].h;S.tz+=30;save();b.textContent='ĐÃ CỨU · +30 TZ';tone(660,.15);setTimeout(()=>tone(990,.25),120)}
  catch(e){b.disabled=false;toast('Chưa gửi được, có thể đã có người cứu trước.')}})}

/* Mã QR thật cho nhân viên quét */
let QRLIB=null;
async function realQR(cv,text){try{if(!QRLIB){await loadScript('lib/qrcode.js');QRLIB=window.qrcode}
 const q=QRLIB(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=Math.floor(200/(n+8)),size=cell*(n+8);cv.width=size;cv.height=size;const g=cv.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,size,size);g.fillStyle='#0b1019';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))g.fillRect((x+4)*cell,(y+4)*cell,cell,cell);return true}catch(e){return false}}

render();
if(!S.profile)profileSheet(true);
cloudInit();
setInterval(()=>{if(!$('#hunt').hidden||tab!=='home')return;const a=$('#infT'),b=$('#infT2');if(S.infectedUntil&&!infected()){S.infectedUntil=0;save();render();return}if(a||b){const t=mmss(S.infectedUntil-Date.now());if(a)a.textContent=t;if(b)b.textContent=t}},1000);
setInterval(()=>{if($('#hunt').hidden&&tab==='home'){const f=S.flash;regen();if(S.flash!==f)render()}},30000);
})();
