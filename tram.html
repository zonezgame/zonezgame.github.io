<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trạm nạp flash · ZONE Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@500;700;800&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Tấm dán trạm nạp: in khổ A5 dọc. Mở trang này rồi bấm In. */
@page{size:A5 portrait;margin:0}
:root{--ink:#0b1019;--sodium:#ffb547;--paper:#fffaf0;--muted:#5b6475}
*{box-sizing:border-box}html,body{margin:0;background:#d9d4c7}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink)}
.bar{max-width:148mm;margin:16px auto;display:flex;gap:10px;padding:0 16px}
.bar button{flex:1;font:700 16px "Be Vietnam Pro",sans-serif;padding:12px;border-radius:12px;border:2px solid var(--ink);background:var(--sodium);cursor:pointer}
.sheet{width:148mm;height:210mm;margin:0 auto 24px;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:10mm 10mm 8mm;box-shadow:0 6px 30px rgba(0,0,0,.25)}
.top{width:100%;background:var(--ink);color:#fff;border-radius:6mm;padding:6mm 6mm 5mm;text-align:center;position:relative}
.top small{display:block;font:700 9pt "Chakra Petch",sans-serif;letter-spacing:.3em;color:var(--sodium)}
.top h1{margin:1.5mm 0 0;font:400 26pt/1 "Bungee",Impact,sans-serif;letter-spacing:.02em}
.top h1 span{color:var(--sodium)}
.bolt{position:absolute;right:6mm;top:5mm;width:12mm;height:12mm}
.lv{margin-top:-4mm;background:var(--sodium);border:1mm solid var(--ink);border-radius:99px;padding:1.5mm 6mm;font:700 11pt "Chakra Petch",sans-serif;letter-spacing:.06em;position:relative;z-index:1}
.qr{margin-top:5mm;width:88mm;height:88mm;padding:4mm;background:#fff;border:1.2mm solid var(--ink);border-radius:5mm;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.name{margin-top:4mm;font:800 15pt "Be Vietnam Pro",sans-serif;text-align:center}
.steps{margin-top:3mm;display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;width:100%}
.steps div{border:.5mm solid var(--ink);border-radius:3mm;padding:2.5mm 2mm;text-align:center;font-size:8.5pt;line-height:1.3}
.steps b{display:block;font:400 13pt "Bungee",sans-serif;color:var(--sodium);-webkit-text-stroke:.2mm var(--ink)}
.rule{margin-top:3mm;font-size:8.5pt;color:var(--muted);text-align:center}
.foot{margin-top:auto;font:700 8pt "Chakra Petch",sans-serif;letter-spacing:.12em;color:var(--muted);text-align:center}
.err{max-width:148mm;margin:40px auto;padding:20px;background:#fff;border-radius:12px;font-size:16px}
@media print{html,body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none}}
</style></head><body>
<div class="bar"><button type="button" onclick="window.print()">In tấm dán (A5)</button></div>
<div id="root"></div>
<script>
(()=>{const q=new URLSearchParams(location.search),id=(q.get('id')||'').replace(/[^A-Za-z0-9]/g,''),name=q.get('name')||'Trạm nạp',lv=q.get('lv')||'nho';
const LV={nho:['TRẠM NHỎ',5],vua:['TRẠM VỪA',10],lon:['TRẠM LỚN',25]}[lv]||['TRẠM NHỎ',5];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root=document.getElementById('root');
if(!id){root.innerHTML='<div class="err">Thiếu mã trạm. Mở trang này từ nút "In QR" trong trang Quầy.</div>';return}
const url='https://zonezgame.github.io/?tram='+id;
const s=document.createElement('script');s.src='lib/qrcode.js';
s.onload=()=>{const qr=qrcode(0,'M');qr.addData(url);qr.make();
 root.innerHTML=`<section class="sheet">
  <div class="top"><svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#ffb547"/></svg><small>ZONE Z · THEZONE</small><h1>TRẠM NẠP <span>FLASH</span></h1></div>
  <div class="lv">⚡ ${LV[0]} · ${LV[1]} LƯỢT/NGÀY</div>
  <div class="qr">${qr.createSvgTag({cellSize:6,margin:0,scalable:true})}</div>
  <div class="name">${esc(name)}</div>
  <div class="steps"><div><b>1</b>Mở camera điện thoại hoặc nút "Quét trạm" trong game</div><div><b>2</b>Quét mã QR ở trên</div><div><b>3</b>Flash đầy 12/12, đi dò zombie tiếp</div></div>
  <p class="rule">Đứng tại trạm và bật vị trí (GPS) khi quét. Mỗi người nạp 1 lần mỗi ngày tại trạm này. Trạm có ${LV[1]} lượt/ngày, hết lượt mở lại lúc 0 giờ.</p>
  <div class="foot">THEZONE · LÊ DUẨN, PHÚ MỸ, PHÚ TÂN · ZONEZGAME.GITHUB.IO</div>
 </section>`};
s.onerror=()=>{root.innerHTML='<div class="err">Chưa tải được bộ tạo QR. Kiểm tra mạng rồi tải lại trang.</div>'};
document.head.appendChild(s)})();
</script>
</body></html>
